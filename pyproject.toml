# Keyra development tool configuration.
#
# No [project] table: the application is not a pip-installable package
# (it runs through run.sh or the .deb package), and the version has a single
# source, `__version__` in app/__init__.py, read by packaging/build-deb.sh.
# Python 3.11 minimum (README, python3 dependency of the .deb).

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# The tests also stay compatible with `python -m unittest discover -s tests`.
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = [
    # An unclosed resource (SQLite connection, file) fails the suite.
    "error::ResourceWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# .venv, build/ and dist/ are part of Ruff's default exclusions.

[tool.ruff.lint]
select = [
    "E",    # pycodestyle (errors)
    "W",    # pycodestyle (warnings)
    "F",    # pyflakes: unused imports and variables, undefined names
    "I",    # import order
    "UP",   # modern Python syntax (3.11)
    "B",    # bugbear: common pitfalls
    "BLE",  # "except Exception": each case must be justified (commented noqa)
    "SIM",  # simplifications
    "DTZ",  # dates without time zone
    "S",    # security (Bandit rules)
    "RUF",  # Ruff-specific rules
    # Bandit checks missing from Ruff's stable rules (see README > Development):
    "PLE2502",  # bidirectional Unicode characters ("trojan source", Bandit B613)
    "S401", "S402", "S403", "S404", "S405", "S406", "S407", "S408", "S409",
    "S411", "S412", "S413", "S415",  # imports of sensitive modules (Bandit B401-B415)
]
# The S4xx rules are in "preview": enabled one by one, without any other preview rule.
preview = true
explicit-preview-rules = true
ignore = [
    # Typographic characters in texts, comments and test data (’, …, —, « ») are intended.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# QSS style sheet: one rule per line, more readable than split.
"app/ui/theme.py" = ["E501"]
"tests/**" = [
    "S101",  # assert: normal in tests
    "S103",  # intentionally permissive chmod (permission preservation test)
    "S105",  # "hard-coded" passwords: test values
    "S106",
    "S107",
    "S404",  # subprocess import, to call pdftotext
    "S603",  # pdftotext calls to check the generated PDFs
    "S607",
]

[tool.ruff.lint.flake8-bugbear]
# Immutable default values: frozen dataclasses and empty Qt index.
extend-immutable-calls = [
    "app.core.generator.PasswordOptions",
    "app.core.generator.PassphraseOptions",
    "PySide6.QtCore.QModelIndex",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
